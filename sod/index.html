   this block needs to change. Strings may contain <br> (and simple HTML).

window.SOD_COPY = {
  bar: { sod: 'Software On Demand', cta: 'Sign Up' },

  hero: { eyebrow: 'Software On Demand', headline: 'What do you want to build?', scroll: 'Scroll' },

  box: {
    build: { label: 'Tell us what to build.', placeholder: 'The product, the people using it, and what success looks like.',
      examples: [

      ] },
    love:  { label: 'What are you good at?', placeholder: 'What you like, what you’re good at, who it’s for.',
      examples: [
        'Fifteen years of IT audits. I know exactly what auditors ask for, and I’m done building it in spreadsheets.',
      ] },
    hint: 'Your request is saved before paid work begins.',
    send: 'Create project and review estimate',
  },

  bloom: {
    eyebrow: 'Ideas',
    stages: ['We grow ideas<br>from what you know.', 'Every idea is scored.<br>The weak are cut.', 'You pick<br>one to build.'],
    pill: 'Build it',
    chosen: 'Quarterly access certification',          // must match one idea title below
    axes: [
      { name: 'Certification', ideas: [['Quarterly access certification', 8.8], ['Manager attestation inbox', 7.4], ['Role mining from usage', 6.8], ['Certification reminders', 4.6]] },
      { name: 'Detection',     ideas: [['Toxic-combination detector', 8.4], ['Orphaned-account sweeper', 7.7], ['Control-drift alerts', 6.3], ['Login anomaly feed', 4.4]] },
      { name: 'Evidence',      ideas: [['Auditor evidence vault', 8.1], ['Continuous SOC 2 evidence', 7.2], ['Screenshot automation', 4.9]] },
      { name: 'Lifecycle',     ideas: [['Joiner-mover-leaver automation', 7.9], ['Contractor offboarding', 6.6], ['Break-glass workflow', 6.0]] },
      { name: 'Integrations',  ideas: [['Okta ↔ AWS reconciliation', 7.6], ['SailPoint migration readiness', 7.0], ['ServiceNow ticket bridge', 5.7]] },
      { name: 'Policy',        ideas: [['SoD rule library', 7.3], ['Policy-as-code linter', 6.5], ['Vendor access expiry', 5.4]] },
    ],
  },

  spec: {
    eyebrow: 'Specification',
    stages: ['Before any code,<br>rival AI models argue it out.', 'One spec survives.<br>You approve every word.'],
    card: { title: 'Your specification', status: 'Agreed',
      sections: [
        ['Problem statement', 'Quarterly access certification for 400 people across Okta and AWS. A reviewer keeps or revokes each entitlement; every decision is evidence.'],
        ['Screens', 'Campaign dashboard · Reviewer inbox · Entitlement detail with toxic-combination flags · Evidence export.'],
        ['Test plan', 'A revoke the connector cannot confirm never shows as complete. The evidence pack names the reviewer, the time, and the connector receipt.'],
      ],
      buttons: ['Ask for a change', 'Approve it'] },
    // the adversarial tree, top to bottom. win:true marks the surviving line; c = critique; sc = score 0–1
    tree: [
      { label: 'THREE FIRST DRAFTS', nodes: [{ x: 260, t: 'Draft A', s: 'written by model 1', k: 'DRAFT', win: true }, { x: 500, t: 'Draft B', s: 'written by model 2', k: 'DRAFT', win: true }, { x: 740, t: 'Draft C', s: 'written by model 3', k: 'DRAFT', win: true }] },
      { label: 'MERGED',              nodes: [{ x: 500, t: 'One merged draft', s: 'the best of all three', k: 'MERGED', w: 230 }] },
      { label: 'ROUND 1 · OPTIONS',   nodes: [{ x: 250, t: 'Campaign-first', s: 'reviewers work a queue', k: 'OPTION', win: true }, { x: 500, t: 'Catalog-first', s: 'entitlements first, review later', k: 'OPTION' }, { x: 750, t: 'Manager-first', s: 'each manager owns a page', k: 'OPTION' }] },
      { label: 'CRITIQUE',            nodes: [{ x: 250, t: 'Revocation unenforced', s: '“revoked” is only a status', k: 'CRITIQUE', c: true, win: true }, { x: 500, t: 'Ignores the request', s: 'no auditor export', k: 'CRITIQUE', c: true }, { x: 750, t: 'Scope unverifiable', s: 'managers self-certify', k: 'CRITIQUE', c: true }] },
      { label: 'SCORED TWICE',        nodes: [{ x: 250, t: '7.9', s: 'two scorers · agree', k: 'SCORE', sc: .79, win: true }, { x: 500, t: '6.1', s: 'two scorers · split', k: 'SCORE', sc: .61 }, { x: 750, t: '5.4', s: 'two scorers · agree', k: 'SCORE', sc: .54 }] },
      { label: 'JUDGE',               nodes: [{ x: 500, t: 'Keep Campaign-first', s: 'a different model judges · two dropped', k: 'JUDGE', j: true, w: 320, win: true }] },
      { label: 'ROUND 2 · OPTIONS',   nodes: [{ x: 350, t: 'Revoke via connector', s: 'Okta / AWS confirm the change', k: 'OPTION', win: true }, { x: 650, t: 'Revoke by ticket', s: 'open a ServiceNow task', k: 'OPTION' }] },
      { label: 'CRITIQUE',            nodes: [{ x: 350, t: 'No proof of revocation', s: 'connector receipt not stored', k: 'CRITIQUE', c: true, win: true }, { x: 650, t: 'Ticket closes unfulfilled', s: 'status ≠ reality', k: 'CRITIQUE', c: true }] },
      { label: 'SCORED TWICE',        nodes: [{ x: 350, t: '8.6', s: 'stores the receipt', k: 'SCORE', sc: .86, win: true }, { x: 650, t: '7.2', s: 'dropped', k: 'SCORE', sc: .72 }] },
      { label: 'ROUND 3',             nodes: [{ x: 500, t: 'AGREED · spec locked', s: 'no open objections left', k: 'JUDGE', conv: true, w: 360, win: true }] },
    ],
  },

  coders: {
    eyebrow: 'Build',
    stages: ['Then the Sneferu Coders<br>build it.', 'They don’t stop<br>until the whole spec works.'],
    seats: ['Writes the code', 'Follows up', 'Reviews both'],
    files: { title: 'Project files', name: 'certify/',
      // trailing "/" = folder · leading "+ " = a file the reviewer forces into existence late
      items: ['app/', '  campaigns.py', '  entitlements.py', '  revocations.py', '  evidence.py', 'connectors/', '  okta.py', '  aws_iam.py', 'tests/', '  test_campaigns.py', '  test_revocations.py', '+   test_evidence_pack.py', 'Dockerfile', 'requirements.txt'] },
    code: { file: 'app/revocations.py', sub: 'writer → follow-up → reviewer', split: 11,   // lines before `split` are the implementer’s, the rest the pair coder’s
      lines: [

        'from datetime import datetime',
        '',
        'class RevocationUnproven(Exception): ...',
        '',
        '@dataclass',
        'class Revocation:',
        '    entitlement: str',
        '    reviewer: str',
        '    receipt: str | None = None',
        '',
        '    def apply(self, connector, *, override=False):',
        '        r = connector.revoke(self.entitlement)',
        '        if not r.confirmed and not override:',
        '            raise RevocationUnproven(self)  # reviewer: was a status flip',
        '        self.receipt = r.receipt_id',
        '        evidence.seal(self, r, datetime.now())',
      ] },
    review: { title: 'Reviewer', sub: 'reviews both',
      findings: [
        { sev: 'Blocker', t: '“Revoked” was a status flip — no connector confirmation.', fix: 'FIXED' },
        { sev: 'Blocker', t: 'Evidence pack missing the reviewer identity.', fix: 'FIXED' },

    tests: { runner: 'Tests', total: 42, ok: 'passed' },

  proof: {
    eyebrow: 'Proof',
    stage: 'Before you see it,<br>we prove it works.',

  preview: {
    eyebrow: 'Preview',
    stages: ['Then you try the real app,<br>before you accept anything.', 'Not right? Say what to fix.<br>We fix it and prove it again.'],
    url: 'preview-7f3a.sneferu.app/',
    app: { brand: 'Certify', title: 'Q3 access certification · Finance', sub: '400 people · Okta + AWS · due in 6 days',
      rows: [
        { user: 'M. Okafor',     ent: 'AWS · prod-db-admin',          flag: 'Toxic with AP-approver', risk: 'high' },
        { user: 'J. Lindqvist',  ent: 'Okta · NetSuite-AP-approver',  flag: '',                       risk: 'med' },
        { user: 'R. Patel',      ent: 'AWS · s3-finance-read',        flag: 'Unused 94 days',         risk: 'low' },
      ],
      keep: 'Keep', revoke: 'Revoke', revoked: 'Revoked',
      panel: { title: 'Evidence pack', items: ['Reviewer identity', 'Decision + timestamp', 'Connector receipt', 'Sealed hash'], button: 'Seal evidence' },
      toast: 'Revoked via Okta · evidence sealed' },
    correct: { q: 'Not right yet?', opts: ['How it works', 'How it looks', 'Both'], note: 'Accepting locks this version.', buttons: ['Fix and re-test', 'Accept'] },
  },

  delivery: {
    eyebrow: 'Delivery',
    stage: 'You pay for the work done.<br>You get exactly what you tried.',
    invoice: { title: 'Invoice', status: 'Under your limit', costLabel: 'Actual cost', cost: 38.2, rows: [['Your limit', '$60.00']], foot: 'Estimates are never charged.' },
    release: { title: 'Your app', status: 'Accepted · locked', rows: [['Version', 'certify · v1'], ['Fingerprint', '9c41…e7f2']], buttons: ['Download', 'Push to GitHub', 'Run it'], foot: 'The same code you tried in the preview. It never changes.' },
  },

  close: { headline: 'Get your best version', cta: 'Sign Up', footer: { by: 'powered by', name: 'Sneferu.ai, Inc.' } },

  // the beta sign-up: the same form and inbox as sneferu.ai, name and email only
  join: { eyebrow: 'Software On Demand', title: 'Join the beta', lede: 'Leave your name and email and we’ll be in touch.',
    name: 'Name', email: 'Email', required: 'Required', submit: 'Join Beta', sending: 'Sending…', close: 'Close', done: 'Done',

<style>
/* ─────────────────────────────────────────────────────────────
   SNEFERU · SOFTWARE ON DEMAND — scroll storyboard
   Brand: night field · limestone ink · ochre → copper progression
   ───────────────────────────────────────────────────────────── */
:root{
  --night:#0E0F13; --night2:#090A0D; --panel:#14161C; --panel2:#1B1E26; --panel3:#232733;
  --line:rgba(243,238,226,.10); --line2:rgba(243,238,226,.18);
  --ink:#F3EEE2; --muted:#A9ACB2; --dim:#767A81;
  --copper:#C9764E; --copper2:#E2946C; --copper-glow:rgba(226,148,108,.45);
  --gold:#AD8433; --gold2:#D8B567; --gold3:#F2CC6B; --ash:#6E6C64;
  --violet:#A78BFA; --green:#72DDA7; --red:#FF8F9D; --blue:#6F86D8; --cyan:#6ED7E8;
  --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:Newsreader,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,48px);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night);scroll-behavior:auto}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--copper2);outline-offset:3px}
::selection{background:rgba(201,118,78,.35);color:var(--ink)}

/* ambient halo (the copper halo from the mark, very quiet) */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60vw 60vw at 50% 110%, rgba(201,118,78,.14), transparent 60%),
    radial-gradient(40vw 40vw at 85% -10%, rgba(173,132,51,.10), transparent 60%);
  opacity:.9}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.9'/></svg>")}

/* ── top bar ── */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) var(--gutter) 14px;
  background:linear-gradient(to bottom, rgba(14,15,19,.92), rgba(14,15,19,.6) 70%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;transform:translateY(-8px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.bar.on{opacity:1;transform:none}
.bar .lockup{display:flex;align-items:center;gap:14px;text-decoration:none;border-radius:6px}
.bar .lockup:focus-visible{outline:2px solid var(--copper2);outline-offset:4px}
.bar .lockup img{height:22px;width:auto}
.bar .lockup .sod{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  padding-left:14px;border-left:1px solid var(--line2)}
.switch{display:flex;gap:2px;padding:3px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.03)}
.switch button{border:0;background:transparent;color:var(--dim);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;letter-spacing:.02em;transition:background .25s,color .25s}
.switch button.on{background:rgba(243,238,226,.10);color:var(--ink)}
.switch button:hover{color:var(--ink)}
@media (max-width:760px){.switch{display:none}}
.bar .cta{border:1px solid rgba(226,148,108,.5);background:rgba(201,118,78,.12);color:var(--ink);border-radius:999px;
  padding:9px 16px;font-size:13px;font-weight:600;letter-spacing:.01em;transition:background .25s}
.bar .cta:hover{background:rgba(201,118,78,.28)}
@media (max-width:640px){.bar .lockup .sod{display:none}.bar .cta{padding:8px 13px;font-size:12px}}

/* ── progress rail (storyboard navigator) ── */
.rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:10px;
  opacity:0;transition:opacity .5s}
.rail.on{opacity:1}
.rail a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;color:var(--dim);font-size:11px;
  font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.rail a span{opacity:0;transform:translateX(6px);transition:opacity .25s,transform .25s}
.rail a i{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:background .3s,transform .3s;flex:none}
.rail a.active i{background:var(--copper2);transform:scale(1.5);box-shadow:0 0 0 4px rgba(226,148,108,.18)}
.rail a.active,.rail:hover a{color:var(--muted)}
.rail:hover a span,.rail a.active span{opacity:1;transform:none}
@media (max-width:900px){.rail{display:none}}

/* ── type ── */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2)}
.display{font-weight:700;letter-spacing:-.045em;line-height:.96;margin:0;text-wrap:balance;
  font-size:clamp(46px,8.4vw,124px)}
.h2{font-weight:700;letter-spacing:-.04em;line-height:1.02;margin:0;text-wrap:balance;font-size:clamp(32px,4.6vw,66px)}
.lede{font-size:clamp(16px,1.45vw,21px);line-height:1.5;color:var(--muted);margin:0;max-width:34em;text-wrap:pretty}
.voice{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.005em}
.display .w{display:inline-block;will-change:transform,opacity}

/* ── scenes ── */
.scene{position:relative;z-index:2}
.pin{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;
  display:grid;grid-template-rows:minmax(0,1fr);place-items:center;padding:0 var(--gutter)}
.stage{position:relative;width:min(1100px,100%);height:100%;display:grid;align-items:start;justify-items:center;padding-top:min(31vh,290px)}
@media (max-height:760px){.copy .lede{display:none}.stage{padding-top:min(24vh,200px)}}
.copy.bottom{top:auto;bottom:calc(7vh + env(safe-area-inset-bottom,0px))}
.copy{position:absolute;left:0;right:0;top:max(calc(8vh + env(safe-area-inset-top,0px)),calc(var(--bar-h,0px) + 2px));display:grid;gap:10px;justify-items:center;text-align:center;
  pointer-events:none;z-index:5}
.copy .h2{max-width:22em;font-size:clamp(26px,3.7vw,54px)}
@media (max-width:420px){.copy .h2{font-size:min(26px,7vw)}} /* the smallest phones: every written line still holds */
.copy .lede{max-width:40em}
.copy-stack{position:relative;width:100%;min-height:9em}
.copy-stack>div{position:absolute;left:0;right:0;top:0;display:grid;gap:10px;justify-items:center}
.caption{position:absolute;left:0;right:0;bottom:calc(6vh + env(safe-area-inset-bottom,0px));text-align:center;z-index:5;pointer-events:none}
.caption p{margin:0;font-size:clamp(15px,1.3vw,19px);color:var(--muted)}
.caption p b{color:var(--ink);font-weight:600}
.caption-stack{position:relative;min-height:2.5em}
.caption-stack>p{position:absolute;left:0;right:0;top:0}

/* ── device / mock-UI frame ── */
.device{position:relative;width:min(1000px,100%);container-type:inline-size;font-size:clamp(10px,1.35cqw,15px)}
.window{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:1.4em;
  box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4) inset;overflow:hidden}
.titlebar{display:flex;align-items:center;gap:.6em;padding:.8em 1.1em;border-bottom:1px solid var(--line);color:var(--dim);font-size:.85em}
.titlebar .dots{display:flex;gap:.45em}
.titlebar .dots i{width:.75em;height:.75em;border-radius:50%;background:#3a3d46}
.titlebar .url{flex:1;text-align:center;font-family:var(--mono);font-size:.85em;letter-spacing:.01em;color:var(--muted);
  background:rgba(0,0,0,.25);border-radius:.5em;padding:.3em .8em;max-width:36em;margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:.5em;border:1px solid var(--line2);border-radius:999px;padding:.35em .8em;font-size:.85em;
  font-weight:600;color:var(--muted);background:rgba(255,255,255,.02)}
.chip i{width:.6em;height:.6em;border-radius:50%;background:var(--dim)}
.chip b{font-weight:600}
.chip.on{color:var(--ink);border-color:rgba(226,148,108,.5)}
.chip.on i{background:var(--copper2);box-shadow:0 0 10px var(--copper-glow)}
.btn{border:0;border-radius:999px;padding:.8em 1.4em;font-weight:600;font-size:.95em;letter-spacing:.005em;
  background:var(--copper);color:#14100c;box-shadow:0 8px 30px rgba(201,118,78,.25);transform-origin:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.cursor{position:absolute;z-index:20;width:1.6em;height:1.6em;left:0;top:0;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.ripple{position:absolute;width:1em;height:1em;border-radius:50%;border:2px solid var(--copper2);opacity:0;pointer-events:none;z-index:19}

/* ── 1 · THE ASK ── */
#s-ask .hero{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:22px;padding:0 var(--gutter);z-index:4}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* load reveal on the inner .rv only — the outer .eyebrow / .cue are driven by the scroll timeline (GSAP reads them, so nothing else may animate them) */
#s-ask .hero .eyebrow .rv{display:flex;align-items:center;justify-content:center;gap:16px;animation:rise .9s .6s var(--ease) backwards}
#s-ask .hero .eyebrow .eb-mark{flex:none;display:block;height:28px;width:auto}
#s-ask .hero .eyebrow .eb-sod{padding-left:16px;border-left:1px solid var(--line2);}
@media (max-width:640px){#s-ask .hero .eyebrow .rv{flex-direction:column;gap:12px}
  #s-ask .hero .eyebrow .eb-mark{height:24px}
  #s-ask .hero .eyebrow .eb-sod{padding-left:0;border-left:0}}
#s-ask .cue .rv{display:grid;justify-items:center;gap:8px;animation:fadein 1s 1.3s var(--ease) backwards}
#s-ask .hero .lede{max-width:36em;font-size:clamp(18px,1.7vw,24px);color:var(--ink);opacity:.85}
#s-ask .cue{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  color:var(--dim);font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600}
#s-ask .cue i{display:block;width:1px;height:44px;background:linear-gradient(var(--copper2),transparent);animation:cue 1.8s var(--ease) infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

.composer{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(820px,calc(100% - 2*var(--gutter)));
  background:linear-gradient(180deg,#171A21,#121419);border:1px solid var(--line2);border-radius:26px;padding:22px 26px 18px;z-index:6;
  box-shadow:0 50px 140px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.5) inset,0 0 80px rgba(201,118,78,.08)}
.composer .lbl{--track:.18;font-size:clamp(12px,1.1vw,15px);font-weight:700;letter-spacing:calc(var(--track) * 1em);text-transform:uppercase;color:var(--ink);margin-bottom:14px;white-space:nowrap}
/* --track is unitless so the tracking-in motion stays in em at every size (GSAP cannot tween letter-spacing in em) */
.composer .text{min-height:3.2em;font-size:clamp(20px,2.6vw,34px);line-height:1.25;color:var(--ink)}
.composer .text .ph{color:var(--dim)}
.caret{display:inline-block;width:2px;height:.95em;background:var(--copper2);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.composer .foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.composer .foot .hint{font-size:13px;color:var(--dim)}
.composer .send{border:0;border-radius:999px;padding:12px 20px;background:var(--copper);color:#15100c;font-weight:600;font-size:14px;
  box-shadow:0 10px 36px rgba(201,118,78,.28);white-space:nowrap}
@media (max-width:640px){.composer .foot{flex-direction:column;align-items:stretch}.composer .foot .hint{display:none}}
.seed{position:absolute;left:50%;top:47%;width:18px;height:18px;border-radius:50%;background:var(--copper2);transform:translate(-50%,-50%) scale(0);
  box-shadow:0 0 30px 6px rgba(226,148,108,.55),0 0 90px 20px rgba(201,118,78,.25);z-index:7}
.person{position:absolute;left:50%;top:calc(47% + 70px);transform:translateX(-50%);width:min(560px,86vw);z-index:8;pointer-events:none}
.person svg{width:100%;height:auto;display:block}
.person .hand{transform-box:fill-box;transform-origin:center}
.person .body{transform-box:fill-box;transform-origin:50% 100%}
#person2{top:auto;bottom:-6vh;width:min(440px,62vw)}
.person.typing .hand-l{animation:tapL .17s ease-in-out infinite alternate}
.person.typing .hand-r{animation:tapR .17s ease-in-out infinite alternate;animation-delay:.085s}
.person.typing .body{animation:sway 1.6s ease-in-out infinite alternate}
@keyframes tapL{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
@keyframes tapR{from{transform:translateY(6px)}to{transform:translateY(-4px)}}
@keyframes sway{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}

#s-ask .caption{bottom:auto;top:calc(9vh + env(safe-area-inset-top,0px))}

/* ── 2 · BLOOM ── */
#bloom{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(1100px,calc(100% - 2*var(--gutter)));height:min(56vh,600px);overflow:visible;z-index:3}
/* side by side only where the widest line fits beside the drawing at display size (measured: 9.4em at ≤2.9vw clears it from 1200px up) */
@media (min-width:1200px){#bloom{left:58%;height:min(70vh,700px);width:min(1000px,70%)}
  .copy.bloom-copy{left:var(--gutter);right:auto;top:50%;bottom:auto;transform:translateY(-50%);width:min(620px,38%);text-align:left;justify-items:start}
  .copy.bloom-copy .copy-stack{min-height:16em}.copy.bloom-copy .copy-stack>div{justify-items:start}
  .copy.bloom-copy .h2{font-size:clamp(34px,2.9vw,60px);line-height:1}
  .copy.bloom-copy .eyebrow{font-size:14px}}
#bloom text{font-family:var(--sans);font-weight:600;fill:var(--ink);letter-spacing:.01em}
#bloom .axis-label{font-size:13px;fill:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
#bloom .idea-label{font-size:11.5px;fill:rgba(243,238,226,.85);font-weight:500}
#bloom .score{font-size:10px;font-weight:700;fill:#14100c}
#bloom .pill-text{font-size:13px;font-weight:700;fill:#14100c}
#bloom .pill{cursor:default}

/* ── 3 · PICK ── */
.idea-card{width:min(720px,100%);background:linear-gradient(180deg,#191C24,#121419);border:1px solid rgba(216,181,103,.35);border-radius:24px;padding:26px 28px;
  box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 90px rgba(216,181,103,.10);position:relative}
.idea-card .rank{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.idea-card .rank b{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--gold3);color:#14100c;font-weight:800;font-size:15px;
  box-shadow:0 0 30px rgba(242,204,107,.45)}
.idea-card .rank span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.idea-card h3{margin:0 0 8px;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.03em;line-height:1.1}
.idea-card p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:44em}
.idea-card .verdict{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.idea-card .verdict b{color:var(--ink);font-weight:600}
.idea-card .notes{margin-top:18px;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.25);min-height:4.2em;font-size:clamp(16px,1.6vw,21px);color:var(--ink)}
.idea-card .notes .lbl{font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.idea-card .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:16px;position:relative}

/* ── 4 · SPEC ── */
.spec-wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:2em;width:100%;align-items:start}
.doc{background:linear-gradient(180deg,#171A21,#111318);border:1px solid var(--line2);border-radius:1.3em;padding:1.6em 1.8em 4.6em;min-height:34em;
  box-shadow:0 40px 120px rgba(0,0,0,.55);position:relative;overflow:hidden}
.doc .dh{font-size:.75em;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:.9em;display:flex;justify-content:space-between;gap:1em}
.doc .dh em{font-style:normal;color:var(--gold2)}
.doc h4{margin:1.1em 0 .35em;font-size:1.05em;letter-spacing:-.01em}
.doc h4:first-of-type{margin-top:0}
.doc p{margin:0;font-size:.9em;line-height:1.55;color:var(--muted)}
.doc .ln{transform-origin:left center}
.doc .note{border-left:3px solid var(--gold);padding:.4em .8em;background:linear-gradient(90deg,rgba(173,132,51,.12),transparent);font-family:var(--serif);font-style:italic;font-size:1.05em;color:var(--ink)}
.doc .stamp{position:absolute;right:1.4em;bottom:1.2em;border:2px solid var(--copper2);color:var(--copper2);border-radius:.5em;padding:.35em .7em;
  font-size:.8em;font-weight:800;letter-spacing:.22em;text-transform:uppercase;transform:rotate(-8deg);opacity:0}
.ladder{display:grid;gap:1em}
.round{border:1px solid var(--line);border-radius:1em;padding:1em 1.1em;background:rgba(255,255,255,.02)}
.round .rh{display:flex;justify-content:space-between;align-items:baseline;font-size:.8em;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.round .rh em{font-style:normal;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500}
.round .seats{display:flex;gap:.5em;margin-top:.8em;flex-wrap:wrap}
.round .seat{display:flex;align-items:center;gap:.45em;font-size:.8em;font-weight:600;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:.3em .7em}
.round .seat i{width:.55em;height:.55em;border-radius:50%;background:var(--dim)}
.round .seat.on{color:var(--ink);border-color:rgba(243,238,226,.25)}
.round .seat.on i{background:var(--gold2);box-shadow:0 0 8px rgba(216,181,103,.6)}
.round .seat.adv.on i{background:var(--red)}
.round .seat.judge.on i{background:var(--copper2)}
.round .track{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:.9em;overflow:hidden}
.round .track b{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--copper2));transform:scaleX(0);transform-origin:left}
.approve{display:flex;gap:.7em;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.spec-wrap{grid-template-columns:1fr}.ladder .round{display:none}.doc{min-height:0;padding-bottom:3.6em}.approve{justify-content:center}}

/* ── 5 · TREE ── */
.spec-card{position:absolute;left:50%;bottom:4%;width:min(640px,96%);min-height:0;padding:1.3em 1.5em 1.4em;z-index:9}
.spec-card h4{font-size:.95em;margin:.9em 0 .25em}.spec-card p{font-size:.85em}
.spec-card .approve{margin-top:1.2em;flex:none}
.spec-card{display:flex;flex-direction:column}.spec-card .dh{flex:none}
.spec-card #spec-sections{flex:1 1 auto;min-height:0;overflow:hidden}
.spec-card.clipped #spec-sections{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 3.2em),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 3.2em),transparent)}
@media (max-width:640px){.spec-card .approve .btn.ghost{display:none}}
#tree{width:min(1000px,100%);height:min(62vh,640px);overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent)}
#tree text{font-family:var(--sans);fill:var(--ink)}
#tree .n-title{font-size:15px;font-weight:600}
#tree .n-score{font-size:18px;font-weight:700}
#tree .n-sub{font-size:11.5px;fill:var(--dim);font-weight:500}
#tree .n-kind{font-size:10px;font-weight:700;letter-spacing:.16em;fill:var(--muted)}
#tree .layer{font-size:11px;font-weight:700;letter-spacing:.18em;fill:var(--dim)}
#tree .layer-bg{fill:var(--night);opacity:.92}
/* tablet + phone tiers: the tree is re-laid out for the width (buildTree), so its type stays readable */
#tree.compact .n-title{font-size:13.5px}
#tree.compact .n-score{font-size:18px}
#tree.compact .n-sub{font-size:11px}
#tree.compact .n-kind{font-size:10px;letter-spacing:.12em}
#tree.compact .layer{font-size:10.5px;letter-spacing:.16em}
#tree.narrow .n-title{font-size:13px}
#tree.narrow .n-score{font-size:18px}
#tree .edge{fill:none;stroke:rgba(243,238,226,.22);stroke-width:1.4}
#tree .edge.win{stroke:var(--gold2);stroke-width:2}
#tree .node rect{fill:#171A21;stroke:rgba(243,238,226,.16);stroke-width:1}
#tree .node.crit rect{fill:#1C1418;stroke:rgba(255,143,157,.35)}
#tree .node.score rect{fill:#15181F;stroke:rgba(243,238,226,.14)}
#tree .node.judge rect{fill:#1B1712;stroke:rgba(226,148,108,.5)}
#tree .node.win rect{stroke:var(--gold2);stroke-width:1.5}
#tree .node.pruned{opacity:.35}
#tree .node.conv rect{fill:#22160f;stroke:var(--copper2);stroke-width:2}
#tree .bar-t{fill:rgba(255,255,255,.08)}
#tree .bar-f{fill:var(--gold2)}

/* ── 6 · ASK ANYONE ── */
.chat{position:absolute;top:31%;width:min(340px,42%);background:linear-gradient(180deg,#171A21,#111318);border:1px solid var(--line2);border-radius:1.2em;padding:1em 1.1em;
  box-shadow:0 40px 120px rgba(0,0,0,.55);z-index:6;font-size:clamp(11px,1.15vw,14.5px)}
.chat.l{left:0}.chat.r{right:0}
.chat .who{display:flex;align-items:center;gap:.6em;font-size:.85em;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-bottom:.8em}
.chat .who i{width:1.6em;height:1.6em;border-radius:.45em;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.75em;color:#14100c;background:var(--ink)}
.chat .msg{border-radius:1em;padding:.7em .9em;font-size:.95em;line-height:1.45;margin-top:.6em;max-width:96%}
.chat .msg.me{background:rgba(201,118,78,.18);border:1px solid rgba(226,148,108,.3);margin-left:auto;font-family:var(--serif);font-style:italic;font-size:1.05em}
.chat .msg.ai{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted)}
.chat .msg.ai b{color:var(--ink);font-weight:600}
.mini-doc{position:absolute;left:50%;top:29%;transform:translateX(-50%);width:min(300px,34%);background:linear-gradient(180deg,#171A21,#111318);border:1px solid var(--line2);
  border-radius:1em;padding:1em 1.1em;z-index:5;font-size:clamp(9px,1vw,12px);box-shadow:0 30px 90px rgba(0,0,0,.5)}
.mini-doc .t{font-size:.8em;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:.7em}
.mini-doc .l{height:.5em;border-radius:.25em;background:rgba(243,238,226,.14);margin:.45em 0}
.mini-doc .l.h{width:55%;background:rgba(243,238,226,.35)}
.mini-doc .l.new{background:linear-gradient(90deg,var(--gold2),var(--copper2));opacity:0;box-shadow:0 0 14px rgba(216,181,103,.5)}
.mini-doc .ok{position:absolute;right:-.6em;top:-.6em;background:var(--green);color:#0b1a12;font-weight:800;font-size:.85em;border-radius:999px;padding:.3em .7em;opacity:0;transform:scale(.6)}
.bounded{position:absolute;left:50%;top:64%;transform:translateX(-50%);z-index:9;display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;width:min(700px,100%)}
@media (max-width:640px){.chat{width:47%;top:26%}.mini-doc{display:none}}

/* ── 7 · BUILD ── */
.build{display:grid;grid-template-columns:.7fr 1.5fr .9fr;gap:1em;width:100%;align-items:stretch}
.pane{background:linear-gradient(180deg,#151820,#101217);border:1px solid var(--line2);border-radius:1.1em;overflow:hidden;min-height:30em;position:relative;
  box-shadow:0 30px 90px rgba(0,0,0,.5)}
.pane .ph{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.75em 1em;border-bottom:1px solid var(--line);font-size:.78em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pane .ph em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;color:var(--muted)}
.pane .body{padding:.9em 1em;font-family:var(--mono);font-size:.86em;line-height:1.7}
.files .f{display:flex;align-items:center;gap:.6em;color:var(--muted);white-space:nowrap}
.files .f.d{color:var(--ink);font-weight:500}
.files .f i{width:.7em;height:.7em;border-radius:.15em;background:var(--dim);flex:none;opacity:.7}
.files .f.d i{background:var(--gold2);opacity:1}
.files .f.new{color:var(--green)}
.code .ln{display:flex;gap:1.1em;white-space:pre;color:var(--muted)}
.code .ln .no{color:var(--dim);width:2ch;text-align:right;flex:none;user-select:none}
.code .ln .src{white-space:pre}
.code .k{color:var(--violet)}.code .s{color:var(--gold2)}.code .fn{color:var(--cyan)}.code .c{color:var(--dim);font-style:italic}.code .t{color:var(--copper2)}
.find{border:1px solid rgba(255,143,157,.3);background:rgba(255,143,157,.06);border-radius:.6em;padding:.55em .7em;margin-bottom:.6em;font-family:var(--sans);font-size:.95em;line-height:1.4;color:var(--muted);position:relative}
.find b{display:block;color:var(--red);font-size:.8em;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.2em}
.find.ok{border-color:rgba(114,221,167,.35);background:rgba(114,221,167,.07)}
.find.ok b{color:var(--green)}
.find .fix{position:absolute;inset:0;border-radius:.6em;display:grid;place-items:center;font-weight:700;color:var(--green);background:rgba(16,18,23,.85);opacity:0;letter-spacing:.08em;font-size:.85em}
.tests{grid-column:1/-1;display:flex;align-items:center;gap:1em;padding:.9em 1.1em;border:1px solid var(--line2);border-radius:1em;background:rgba(255,255,255,.02);font-family:var(--mono);font-size:.9em}
.tests .track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.tests .track b{display:block;height:100%;width:100%;background:var(--green);transform:scaleX(0);transform-origin:left}
.tests .n{font-variant-numeric:tabular-nums;color:var(--ink);min-width:9ch;text-align:right}
.tests .ok{color:var(--green);font-weight:700;opacity:0}
.seats{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap;margin-bottom:1em;grid-column:1/-1}
@media (max-width:760px){.build{grid-template-columns:1fr}.pane{min-height:0}.files,.review{display:none}}

/* ── 8 · PROOF ── */
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:1em;width:100%}
.tile{border:1px solid var(--line2);border-radius:1.2em;padding:1.4em 1.3em 1.3em;background:linear-gradient(180deg,#171A21,#111318);min-height:11em;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.45)}
.tile .ck{width:2.6em;height:2.6em;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;margin-bottom:1em}
.tile .ck svg{width:1.4em;height:1.4em}
.tile .ck path{fill:none;stroke:var(--green);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.tile.on .ck{border-color:rgba(114,221,167,.6);box-shadow:0 0 30px rgba(114,221,167,.18)}
.tile h5{margin:0 0 .35em;font-size:1.05em;letter-spacing:-.01em}
.tile p{margin:0;font-size:.85em;color:var(--muted);line-height:1.45;font-family:var(--mono)}
@media (max-width:760px){.wall{grid-template-columns:1fr 1fr}.tile{min-height:0}}

/* ── 9 · PREVIEW (the built app: an access-certification tool) ── */
.app{padding:1.2em 1.4em 1.4em;background:#F6F1E8;color:#2A2420;font-family:var(--sans);position:relative;min-height:30em}
.app .brand{display:flex;justify-content:space-between;align-items:baseline;gap:1em;margin-bottom:1em}
.app .brand b{font-family:var(--serif);font-style:italic;font-size:1.5em;letter-spacing:-.01em}
.app .brand span{font-size:.8em;color:#7a6f66}
.rev{display:grid;grid-template-columns:1.45fr .8fr;gap:1.2em}
.rev-title{font-size:.8em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7a6f66;margin:0 0 .7em}
.rev-list{display:grid;gap:.55em}
.rev-row{display:grid;grid-template-columns:1fr 1.7fr auto;gap:.8em;align-items:center;background:#fff;border:1px solid #e6dfd3;border-radius:.8em;padding:.75em .95em;box-shadow:0 6px 18px rgba(60,40,20,.05);position:relative}
.rev-row .u{font-weight:600;font-size:.95em}
.rev-row .e{font-family:var(--mono);font-size:.8em;color:#4a4340;display:flex;flex-direction:column;gap:.25em;align-items:flex-start}
.rev-row .flag{font-family:var(--sans);font-size:.7em;font-weight:600;padding:.15em .55em;border-radius:999px;background:#fdecec;color:#a52a2a}
.rev-row .flag.low{background:#fff4dc;color:#8a5a00}
.rev-row .acts{display:flex;gap:.4em}
.rev-row .b{border:1px solid #2A2420;background:#fff;color:#2A2420;border-radius:999px;padding:.32em .75em;font-size:.78em;font-weight:600;white-space:nowrap}
.rev-row .b.rv.on{background:#2A2420;color:#fff}
.rev-row.done .u,.rev-row.done .e{opacity:.45}
.evid{border-radius:.9em;background:#fff;border:1px solid #e6dfd3;padding:.9em 1em;align-self:start}
.evid h6{margin:0 0 .6em;font-size:.8em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7a6f66}
.evid .it{display:flex;justify-content:space-between;align-items:center;font-size:.82em;padding:.42em 0;border-bottom:1px solid #f0ebe3}
.evid .it i{font-style:normal;font-weight:700;color:#1f6b4a;opacity:0}
.evid .seal{margin-top:.9em;width:100%;background:#C9764E;color:#fff;border:0;border-radius:999px;padding:.55em;font-weight:600;font-size:.85em}
.toast{position:absolute;left:50%;bottom:1.2em;transform:translate(-50%,20px);background:#1f6b4a;color:#fff;border-radius:999px;padding:.6em 1.1em;font-weight:600;font-size:.9em;opacity:0;
  box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
.correct{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:min(760px,96%);background:linear-gradient(180deg,#171A21,#111318);border:1px solid var(--line2);
  border-radius:1.2em;padding:1.1em 1.3em;z-index:9;display:grid;gap:.8em;box-shadow:0 40px 120px rgba(0,0,0,.6);font-size:clamp(11px,1.15vw,14.5px)}
.correct .q{font-weight:600;font-size:1.05em}
.correct .opts{display:flex;gap:.5em;flex-wrap:wrap}
.correct .opt{border:1px solid var(--line2);border-radius:999px;padding:.4em .9em;font-size:.85em;color:var(--muted)}
.correct .row{display:flex;justify-content:space-between;align-items:center;gap:1em;flex-wrap:wrap}
.correct .row small{color:var(--dim);font-size:.8em}
@media (max-width:760px){.rev{grid-template-columns:1fr}.rev-row{grid-template-columns:1fr auto}.rev-row .e{display:none}}

/* ── 10 · DELIVER ── */
.deliver{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;width:min(960px,100%)}
.card{background:linear-gradient(180deg,#171A21,#111318);border:1px solid var(--line2);border-radius:1.3em;padding:1.5em 1.6em;box-shadow:0 40px 120px rgba(0,0,0,.55);position:relative}
.card .ch{font-size:.75em;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:1em;display:flex;justify-content:space-between}
.card .ch em{font-style:normal;color:var(--green)}
.kv{display:grid;grid-template-columns:1fr auto;gap:.5em 1em;font-size:.95em}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.kv b.big{font-size:1.6em;letter-spacing:-.03em}
.kv b.mono{font-family:var(--mono);font-weight:500;font-size:.8em;color:var(--muted)}
.card .foot{margin-top:1.2em;padding-top:1em;border-top:1px solid var(--line);font-size:.8em;color:var(--dim);line-height:1.45}
.card .actions{display:flex;gap:.6em;margin-top:1.2em;flex-wrap:wrap}
.card .btn{font-size:.9em}
.receipt-line{height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);margin:.9em 0}
@media (max-width:760px){.deliver{grid-template-columns:1fr}}

/* ── 11 · CLOSE ── */
.close{position:relative;box-sizing:border-box;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:64px var(--gutter)}
.close img{width:min(520px,80vw)}
.close .h2{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.005em;line-height:1.15;font-size:clamp(24px,2.8vw,38px);color:var(--ink)} /* the closing line is a tagline in the page's own voice, not another headline */
.close .cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.close .btn{font-size:15px;padding:14px 24px}
.close footer{position:absolute;left:var(--gutter);right:var(--gutter);bottom:24px;font-size:12px;color:var(--dim);letter-spacing:.06em}
.close footer a{color:var(--muted);font-weight:600;text-decoration:none;border-radius:4px}
.close footer a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* the beta sign-up: one small card over the story, in the page's own materials */
.join{padding:0;border:0;background:transparent;color:var(--ink);width:min(440px,calc(100% - 2*var(--gutter)));max-width:none;max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain}
.join::backdrop{background:rgba(9,10,13,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.join[open]{animation:join-in .32s var(--ease) both}
@keyframes join-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.join-card{position:relative;background:linear-gradient(180deg,#171A21,#111318);border:1px solid var(--line2);border-radius:1.3em;padding:30px 28px 26px;box-shadow:0 40px 120px rgba(0,0,0,.55);font-family:var(--sans);text-align:left}
.join-x{position:absolute;top:12px;right:12px;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:999px;background:transparent;color:var(--dim);cursor:pointer}
.join-x:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.join .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.join-title{margin:10px 0 8px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-size:clamp(28px,4vw,34px)}
.join-lede{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.5;text-wrap:pretty}
.join-fields{display:grid;gap:14px}
.join-field label{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.join-field label em{font-style:normal;font-weight:600;letter-spacing:.08em;color:var(--copper2)}
.join-field input{display:block;box-sizing:border-box;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:rgba(0,0,0,.25);color:var(--ink);font:400 16px/1.4 var(--sans);transition:border-color .16s,box-shadow .16s}
.join-field input:focus{outline:0;border-color:var(--copper2);box-shadow:0 0 0 3px rgba(226,148,108,.18)}
.join .btn{font-size:15px;padding:14px 24px;cursor:pointer}
.join-submit{width:100%;margin-top:8px}
.join-submit:disabled{cursor:wait;opacity:.62}
.join-status{margin:18px 0 0;padding:14px 16px;border-left:2px solid var(--gold2);background:rgba(216,181,103,.07);color:var(--ink);font:400 16px/1.5 var(--sans);border-radius:0 8px 8px 0}
.join-status.is-error{border-left-color:var(--copper2);background:rgba(201,118,78,.09)}
.join-status:focus{outline:0}
.join-done{width:100%;margin-top:14px}
.join-hp{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}
@media (prefers-reduced-motion: reduce){.join[open]{animation:none}}

/* breath sections between pinned scenes */
.breath{position:relative;z-index:2;display:grid;place-items:center;text-align:center;padding:22vh var(--gutter);min-height:60vh}
.breath .h2{max-width:14em}
.breath .lede{margin-top:16px;max-width:30em}

/* reduced motion / no-GSAP fallback: every scene rests in its finished state */
.static .pin{height:auto;min-height:0;padding-block:12vh}
.static .stage{height:auto;gap:2em}
.static .copy,.static .caption,.static .correct,.static .bounded{position:relative;top:auto;bottom:auto;transform:none}
.static .copy-stack>div:not(:last-child),.static .caption-stack>p:not(:last-child){display:none}
.static .copy-stack,.static .caption-stack{min-height:0}
.static .copy-stack>div,.static .caption-stack>p{position:relative}
.static #s-ask .hero{position:relative;padding:18vh 0 6vh}
.static .composer,.static .seed,.static .person,.static .cursor,.static .ripple{display:none}
.static .chat,.static .mini-doc{position:relative;width:auto;left:auto;right:auto;top:auto;transform:none}
.static .rail{display:none}
.static .spec-card{position:relative;left:auto;bottom:auto;width:min(640px,100%);margin:2em auto 0}
</style>
</head>

<script>
(function(){
'use strict';
const C=window.SOD_COPY;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;};
const h=(tag,cls,html,parent)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;if(parent)parent.appendChild(n);return n;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const glowDefs=(svg,id)=>{const defs=el('defs',{},svg);const f=el('filter',{id,x:'-80%',y:'-80%',width:'260%',height:'260%'},defs);
  el('feGaussianBlur',{stdDeviation:'7',result:'b'},f);const m=el('feMerge',{},f);el('feMergeNode',{'in':'b'},m);el('feMergeNode',{'in':'b'},m);el('feMergeNode',{'in':'SourceGraphic'},m);};

/* ───────────── COPY → DOM (everything with data-c, plus the generated lists) ───────────── */
const get=(path)=>path.split('.').reduce((o,k)=>o==null?o:o[k],C);
$$('[data-c]').forEach(n=>{const v=get(n.dataset.c);if(v!=null)n.innerHTML=v;});
// the headline, split into words so it can animate in
$('#h1').innerHTML=C.hero.headline.split(' ').map(w=>`<span class="w">${esc(w)}</span>`).join(' ');
// specification card
C.spec.card.sections.forEach(([t,p])=>{h('h4','ln',t,$('#spec-sections'));h('p','ln',p,$('#spec-sections'));});
// coders: file tree, code, findings
C.coders.files.items.forEach(it=>{const late=it.startsWith('+ ');const name=late?it.slice(2):it;const dir=name.trim().endsWith('/');
  const indent=name.match(/^\s*/)[0].replace(/ /g,'&nbsp;');h('div','f'+(dir?' d':'')+(late?' new':''),indent+'<i></i>'+esc(name.trim()),$('#files-body'));});
const TOK=/(#.*$)|(&quot;[^&]*&quot;|'[^']*')|\b(\d+)\b|\b(from|import|class|def|return|if|else|raise|not|and|or|None|True|False)\b|\b([A-Z][A-Za-z_]*)\b|\b([a-z_][a-z0-9_]*)(?=\()/g;
function hl(line){return esc(line).replace(TOK,(m,cm,str,num,kw,ty,fn)=>cm?`<span class="c">${cm}</span>`:str?`<span class="s">${str}</span>`:num?`<span class="s">${num}</span>`:kw?`<span class="k">${kw}</span>`:ty?`<span class="t">${ty}</span>`:`<span class="fn">${fn}</span>`);}
C.coders.code.lines.forEach((ln,i)=>h('div','ln',`<span class="no">${i+1}</span><span class="src">${hl(ln)}</span>`,$('#code-body')));
C.coders.review.findings.forEach(f=>h('div','find',`<b>${f.sev}</b>${f.t}<div class="fix">${f.fix}</div>`,$('#review-body')));
$('#test-n').textContent='0 / '+C.coders.tests.total;
// proof tiles
C.proof.tiles.forEach(([t,p])=>h('div','tile',`<div class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17 L19 7"/></svg></div><h5>${t}</h5><p>${p}</p>`,$('#wall')));
// the built app
C.preview.app.rows.forEach((r,i)=>h('div','rev-row',`<span class="u">${r.user}</span><span class="e">${r.ent}${r.flag?`<span class="flag ${r.risk==='low'?'low':''}">${r.flag}</span>`:''}</span><span class="acts"><button type="button" class="b">${C.preview.app.keep}</button><button type="button" class="b rv" id="rv-${i}">${C.preview.app.revoke}</button></span>`,$('#rev-list')));
C.preview.app.panel.items.forEach(t=>h('div','it',`<span>${t}</span><i>✓</i>`,$('#evid-items')));
C.preview.correct.opts.forEach(o=>h('span','opt',o,$('#correct-opts')));
// delivery
C.delivery.invoice.rows.forEach(([k,v])=>{h('span',null,k,$('#invoice-kv'));h('b',null,v,$('#invoice-kv'));});
C.delivery.release.rows.forEach(([k,v],i)=>{h('span',null,k,$('#release-kv'));h('b',i?'mono':null,v,$('#release-kv'));});
C.delivery.release.buttons.forEach((b,i)=>{const n=h('button','btn'+(i?' ghost':''),b,$('#release-actions'));n.type='button';if(!i)n.id='dl-btn';});

/* ───────────── the character (seen from behind, lit by the screen) ─────────────
   Six people sit at that keyboard. One is picked at random each visit and stays for the
   whole scroll, so the story still follows a single customer and no one person is "the"
   customer. Add ?person=0…5 to the address to hold one still. */
const PEOPLE = [
  // hands, neck and nape always share one skin, or the figure reads as a costume
  { skin:'#C99271', dark:'#A97556', hair:['#4A3529','#1B120E'], coat:['#40434D','#1D1F25'], head:'tail',   ear:true  },
  { skin:'#7A4C2E', dark:'#5E3821', hair:['#2A1D17','#100A08'], coat:['#3A4652','#191F27'], head:'crop',   ear:false },
  { skin:'#E3BC98', dark:'#C29A78', hair:['#7B5A31','#3B2913'], coat:['#4A3D4C','#211C22'], head:'bun',    ear:true  },
  { skin:'#5E3A22', dark:'#472B18', hair:['#241812','#0D0807'], coat:['#434A3C','#1D211A'], head:'curls',  ear:true  },
  { skin:'#D2A882', dark:'#B08664', hair:['#9A9DA4','#55575D'], coat:['#4A4038','#221E1A'], head:'silver', ear:false },
  { skin:'#A8703F', dark:'#85552C', hair:['#4C3C54','#241C29'], coat:['#3B3F49','#1B1D23'], head:'wrap',   ear:false }
];
const WHO = (()=>{ const q=parseInt(new URLSearchParams(location.search).get('person'),10);
  return PEOPLE[Number.isInteger(q)&&q>=0&&q<PEOPLE.length ? q : Math.floor(Math.random()*PEOPLE.length)]; })();

function headSVG(w,id){
  const hr=`url(#${id}-hr)`;
  // what the screen light catches, whatever is on the head
  const sheen=`<path d="M262,118 C280,96 320,96 338,118" fill="none" stroke="rgba(243,238,226,.09)" stroke-width="2"/>
    <path d="M240,152 C250,112 275,92 300,90 C325,92 350,112 360,152" fill="none" stroke="rgba(243,238,226,.24)" stroke-width="3" stroke-linecap="round"/>`;
  const nape=`<circle cx="300" cy="230" r="31" fill="${w.hair[1]}"/>`;
  const ear=w.ear?`<circle cx="365" cy="196" r="5" fill="none" stroke="#D8B567" stroke-width="2"/>`:'';
  let head='';
  if(w.head==='tail'){          // gathered at the nape, falling over the collar
    head=`${nape}<path d="M300,244 C286,292 290,344 300,380 C310,344 314,292 300,244 Z" fill="${hr}"/>
      <ellipse cx="300" cy="166" rx="66" ry="76" fill="${hr}"/>`;
  }else if(w.head==='crop'){    // cut close
    head=`<ellipse cx="300" cy="170" rx="61" ry="69" fill="${hr}"/>`;
  }else if(w.head==='bun'){     // wound up, high on the head
    head=`${nape}<ellipse cx="300" cy="166" rx="66" ry="76" fill="${hr}"/>
      <circle cx="300" cy="104" r="27" fill="${hr}"/><circle cx="300" cy="104" r="27" fill="none" stroke="rgba(243,238,226,.16)" stroke-width="2"/>`;
  }else if(w.head==='curls'){   // texture around the crown
    let ring='';
    for(let i=0;i<14;i++){ const a=i/14*Math.PI*2, rx=64+ (i%3)*3;
      ring+=`<circle cx="${(300+rx*Math.cos(a)).toFixed(1)}" cy="${(170+(rx+8)*Math.sin(a)*.92).toFixed(1)}" r="${13+(i%4)*2.2}" fill="${hr}"/>`; }
    head=`${nape}${ring}<ellipse cx="300" cy="170" rx="64" ry="72" fill="${hr}"/>`;
  }else if(w.head==='silver'){  // shorter, grey
    head=`<ellipse cx="300" cy="168" rx="63" ry="71" fill="${hr}"/>`;
  }else{                        // a covered head: cloth over the crown, draped to the shoulders
    head=`<path d="M258,214 C258,256 342,256 342,214 L348,268 C330,278 270,278 252,268 Z" fill="${w.hair[1]}"/>
      <ellipse cx="300" cy="168" rx="74" ry="82" fill="${hr}"/>
      <path d="M232,182 C258,150 342,150 368,182" fill="none" stroke="rgba(243,238,226,.14)" stroke-width="3" stroke-linecap="round"/>`;
  }
  return head+sheen+ear;
}

function personSVG(id,w){
  w = w || WHO;
  let keys='';

/* ───────────── THE TREE — built from SOD_COPY.spec.tree ─────────────
   Three layout tiers, one data set: desktop keeps the authored x positions (layer names in their own column);
   tablet and phone re-flow each row into even columns at a drawing width near the screen's, so the type is
   never shrunk to illegibility. The drawing's height follows the box it sits in (no letterboxing). */
const T={mode:null,texts:[]};

const treeMode=()=>window.matchMedia(TREE_MQ.narrow).matches?'narrow':window.matchMedia(TREE_MQ.medium).matches?'medium':'wide';
// write t._fit.src as up to t._fit.lines lines no wider than t._fit.maxW (breaks at spaces and after hyphens; the last
// line ellipsizes). Measured in the drawing's own units, so it is re-run once the web fonts arrive.
function fitText(t){
  const f=t._fit, x=t.getAttribute('x');

  const w=str=>{probe.textContent=str;return probe.getComputedTextLength();};
  const tokens=[]; String(f.src).split(/\s+/).filter(Boolean).forEach(word=>(word.match(/[^-]+-?|-/g)||[word]).forEach((part,i)=>tokens.push({part,glue:i>0})));
  const out=[]; let cur='';

    if(!cur||w(cand)<=f.maxW||out.length>=f.lines-1)cur=cand; else{out.push(cur);cur=part;}});
  if(cur)out.push(cur);

  const svg=$('#tree'); if(!T.W||!T.convNode||!svg.clientWidth||!svg.clientHeight)return;

      lab=el('g',{'class':'layer-tag'},g);

      let bar=null;

/* ── layout that depends on real text and real screens (re-measured on every ScrollTrigger refresh) ──
   · every headline block clears the fixed bar; each stack reserves exactly its tallest headline
   · the stage below starts where that headline block ends (no guessed padding — the copy is editable)
   · the frozen spec card stays below its headline; its sections fade if the screen is short
   · the tree's drawing takes the height of the box it sits in */
function fitLayout(){

  // measured against the pinned screen itself, never a box that could grow with its own contents
  $$('.pin').forEach(pin=>{
    const copies=Array.from(pin.querySelectorAll(':scope > .copy')); if(!copies.length)return;
    copies.forEach(c=>{const stack=c.querySelector('.copy-stack');
      if(stack){stack.style.minHeight='0px';stack.style.minHeight=Math.ceil(Math.max(0,...Array.from(stack.children,k=>k.offsetHeight)))+'px';}});
    const copy=copies.find(c=>!c.classList.contains('bottom'));
    const stage=pin.querySelector(':scope > .stage');
    if(copy)copy.style.marginTop='0px';
    if(stage&&copy)stage.style.paddingTop=Math.round(copy.offsetTop+copy.offsetHeight+(window.innerHeight<700?14:22))+'px';
    // a mock-UI panel is built in em: when it is taller than the room left under its headline, shrink its type to fit
    const dev=stage&&stage.querySelector(':scope > .device');
    if(dev){dev.style.fontSize='';

        if(room<=0||hh<=room)break; dev.style.fontSize=Math.max(9,parseFloat(getComputedStyle(dev).fontSize)*room/hh).toFixed(2)+'px';}}
    // a short scene (four tiles, two cards) sits with its headline as one group on the screen — never a headline at the

pinScene('#s-ask',29,0,tl=>{

    T.edges.forEach(p=>{tl.to(p,{strokeDashoffset:0,duration:.5,ease:'power1.inOut'},Math.max(0,at[+p.dataset.row]-.3));});

    tl.to(T.g,{y:()=>T.panTo,duration:5.0,ease:'none'},2.6);
    // the frozen specification rises; the tree recedes behind it

/* ── chrome: bar + rail ── */
const closeEl=$('#s-close');
function chrome(){const y=window.scrollY;const closeTop=closeEl.getBoundingClientRect().top+y;const on=y>window.innerHeight*.12&&y<closeTop-window.innerHeight*.55;bar.classList.toggle('on',on);rail.classList.toggle('on',on);}
window.addEventListener('scroll',chrome,{passive:true});ScrollTrigger.addEventListener('refresh',chrome);chrome();
function setActive(id){$$('#rail a').forEach(a=>a.classList.toggle('active',a.dataset.s===id));}
const jump={'s-bloom':{trigger:'s-ask',p:.5}};
const stOf=id=>ScrollTrigger.getAll().find(s=>s.trigger&&s.trigger.id===id);
$$('#rail a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const j=jump[a.dataset.s]||{trigger:a.dataset.s,p:0};
  const st=stOf(j.trigger);if(!st)return;window.scrollTo({top:st.start+(st.end-st.start)*(j.p||0)+(j.p?0:8),behavior:'smooth'});}));
window.addEventListener('load',()=>ScrollTrigger.refresh());
})();
</script>

<script>
/* Beta sign-up: submits to the same form as sneferu.ai without leaving the page. Works with or without the animation. */
(function(){
  const C=window.SOD_COPY.join, dlg=document.getElementById('join'), form=document.getElementById('join-form');
  const fields=document.getElementById('join-fields'), submit=document.getElementById('join-submit');
  const status=document.getElementById('join-form-status'), done=document.getElementById('join-done');
  if(!dlg||!form)return;

  function open(){
    if(typeof dlg.showModal==='function'){ if(!dlg.open)dlg.showModal(); } else dlg.setAttribute('open','');
    lock(true);
    const name=document.getElementById('join-name'); try{name.focus({preventScroll:true});}catch(e){name.focus();}
  }
  function close(){ if(typeof dlg.close==='function')dlg.close(); else{dlg.removeAttribute('open');dlg.dispatchEvent(new Event('close'));} }
  function showStatus(msg,isError){ status.textContent=msg; status.classList.toggle('is-error',!!isError); status.hidden=false;
    try{status.focus({preventScroll:true});}catch(e){status.focus();} }

  ['bar-cta','close-cta'].forEach(id=>{const b=document.getElementById(id); if(b)b.addEventListener('click',open);});
  document.getElementById('join-x').addEventListener('click',close);
  done.addEventListener('click',close);
  // a click on the dimmed backdrop (outside the card) closes it
  dlg.addEventListener('click',e=>{ if(e.target===dlg)close(); });
  // the story behind does not scroll while the card is open (unless the card itself must scroll, e.g. a phone keyboard is up)
  const scrollsItself=e=>dlg.contains(e.target)&&dlg.scrollHeight>dlg.clientHeight+1;
  const hold=e=>{ if(!scrollsItself(e))e.preventDefault(); };
  const keys=e=>{ const typing=/^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    if(['PageUp','PageDown'].includes(e.key)||(!typing&&[' ','ArrowUp','ArrowDown','Home','End'].includes(e.key)&&e.target.tagName!=='BUTTON'))e.preventDefault(); };
  function lock(on){ const m=on?'addEventListener':'removeEventListener';
    window[m]('wheel',hold,{passive:false}); window[m]('touchmove',hold,{passive:false}); window[m]('keydown',keys); }
  // closing clears any message; after a sign-up it also resets the form
  dlg.addEventListener('close',()=>{ lock(false); status.hidden=true; status.textContent='';
    if(fields.hidden){ form.reset(); fields.hidden=false; done.hidden=true; } });

  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(!form.reportValidity())return;
    status.hidden=true; status.textContent=''; status.classList.remove('is-error');
    submit.disabled=true; submit.textContent=C.sending; form.setAttribute('aria-busy','true');
    fetch(form.action,{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}})
      .then(r=>{ if(!r.ok)throw new Error(r.status===429?'rate-limit':'submit-failed');
        form.reset(); fields.hidden=true; done.hidden=false; showStatus(C.sent,false); })
      .catch(err=>showStatus(err&&err.message==='rate-limit'?C.wait:C.failed,true))
      .then(()=>{ submit.disabled=false; submit.textContent=C.submit; form.removeAttribute('aria-busy'); });
  });
})();
</script>
